name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""              # default (no features)
          - "http"          # ArkretPushClient HTTP helper (release surface)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
      - name: Check (features=${{ matrix.features || 'default' }})
        run: cargo check --locked --no-default-features --features "${{ matrix.features }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Test (features=${{ matrix.features || 'default' }})
        run: cargo test --locked --no-default-features --features "${{ matrix.features }}"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (features=${{ matrix.features || 'default' }})
        run: cargo clippy --locked --no-default-features --features "${{ matrix.features }}" -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Build examples
        run: cargo build --locked --examples --no-default-features

  msrv:
    name: MSRV (1.98)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV (all features)
        run: cargo check --locked --all-features

  # AKP-0007 P2D.4 — wasm32-unknown-unknown coverage. chime advertises
  # first-class wasm32 support (Cargo.toml splits per-target
  # dependencies for reqwest/gloo-timers); without this job a wasm-only
  # regression — e.g. a tokio API call leaking into the http feature
  # path or a doc-link relying on a native-only re-export — slips
  # through the linux-only matrix above.
  wasm32:
    name: wasm32 (build + doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32, http)
        run: cargo check --locked --target wasm32-unknown-unknown --features http
      - name: cargo build (wasm32, http)
        # `cargo check` exercises typeck but not codegen; a real build
        # surfaces wasm-specific codegen panics (e.g. an inadvertent
        # `unsafe` block that monomorphises to an unsupported intrinsic)
        # before they reach a release tag.
        run: cargo build --locked --target wasm32-unknown-unknown --features http
      - name: cargo doc (wasm32, http, no-deps)
        run: cargo doc --locked --target wasm32-unknown-unknown --no-deps --features http
        env:
          RUSTDOCFLAGS: -Dwarnings

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  package:
    name: Package source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      # SDK dependencies are developed together and have no registry release.
      # Compilation is covered by the feature and target jobs above; this gate
      # checks the actual source archive without resolving a publish-time lock.
      - name: Package source archive
        run: cargo package --exclude-lockfile --no-verify

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      # The sibling checkout lives outside GITHUB_WORKSPACE and is not mounted
      # inside Docker actions. Run the same policy on the runner host.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.5 --locked
      - name: Cargo deny
        run: cargo deny --locked --all-features check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - name: Fetch locked dependencies for audit
        run: cargo fetch --locked
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
