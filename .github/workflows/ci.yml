name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""              # default (no features)
          - "http"          # ContrixPushClient HTTP helper
          - "notify"        # cx.push.notify wire types
          - "http,notify"   # combined (release surface)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check (features=${{ matrix.features || 'default' }})
        run: cargo check --no-default-features --features "${{ matrix.features }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
          - "notify"
          - "http,notify"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (features=${{ matrix.features || 'default' }})
        run: cargo test --no-default-features --features "${{ matrix.features }}"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
          - "notify"
          - "http,notify"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (features=${{ matrix.features || 'default' }})
        run: cargo clippy --no-default-features --features "${{ matrix.features }}" -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV (all features)
        run: cargo check --all-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  package:
    name: Package (cargo publish --dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo package --no-verify
        run: cargo package --no-verify --allow-dirty
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --allow-dirty --all-features

  # CXP-0007 P2D.3 — exercise the live floria integration test with
  # CHIME_INTEGRATION_REQUIRED=1 so a missing floria binary fails the
  # CI run instead of silently green-skipping.
  live-integration:
    name: Live floria integration
    runs-on: ubuntu-latest
    env:
      CHIME_INTEGRATION_REQUIRED: "1"
    steps:
      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          path: chime
      - name: Checkout sibling floria
        uses: actions/checkout@v4
        with:
          repository: contrix-dev/floria
          path: floria
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            chime
            floria
      - name: Build floria binary
        working-directory: floria
        run: cargo build --bin floria
      - name: Run chime live floria integration
        working-directory: chime
        env:
          FLORIA_BIN: ${{ github.workspace }}/floria/target/debug/floria
        run: cargo test --features http,notify --test live_floria_integration -- --test-threads=1

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
