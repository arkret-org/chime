name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""              # default (no features)
          - "http"          # ArkretPushClient HTTP helper (release surface)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check (features=${{ matrix.features || 'default' }})
        run: cargo check --no-default-features --features "${{ matrix.features }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Test (features=${{ matrix.features || 'default' }})
        run: cargo test --no-default-features --features "${{ matrix.features }}"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (features=${{ matrix.features || 'default' }})
        run: cargo clippy --no-default-features --features "${{ matrix.features }}" -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Build examples
        run: cargo build --examples --no-default-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV (all features)
        run: cargo check --all-features

  # AKP-0007 P2D.4 — wasm32-unknown-unknown coverage. chime advertises
  # first-class wasm32 support (Cargo.toml splits per-target
  # dependencies for reqwest/gloo-timers); without this job a wasm-only
  # regression — e.g. a tokio API call leaking into the http feature
  # path or a doc-link relying on a native-only re-export — slips
  # through the linux-only matrix above.
  wasm32:
    name: wasm32 (build + doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32, http)
        run: cargo check --target wasm32-unknown-unknown --features http
      - name: cargo build (wasm32, http)
        # `cargo check` exercises typeck but not codegen; a real build
        # surfaces wasm-specific codegen panics (e.g. an inadvertent
        # `unsafe` block that monomorphises to an unsupported intrinsic)
        # before they reach a release tag.
        run: cargo build --target wasm32-unknown-unknown --features http
      - name: cargo doc (wasm32, http, no-deps)
        run: cargo doc --target wasm32-unknown-unknown --no-deps --features http
        env:
          RUSTDOCFLAGS: -Dwarnings

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  package:
    name: Package (cargo publish --dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: Swatinem/rust-cache@v2
      - name: cargo package --no-verify
        run: cargo package --no-verify --allow-dirty
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --allow-dirty --all-features

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
