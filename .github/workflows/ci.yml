name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""              # default (no features)
          - "http"          # ContrixPushClient HTTP helper
          - "notify"        # cx.push.notify wire types
          - "http,notify"   # combined (release surface)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check (features=${{ matrix.features || 'default' }})
        run: cargo check --no-default-features --features "${{ matrix.features }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
          - "notify"
          - "http,notify"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (features=${{ matrix.features || 'default' }})
        run: cargo test --no-default-features --features "${{ matrix.features }}"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "http"
          - "notify"
          - "http,notify"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (features=${{ matrix.features || 'default' }})
        run: cargo clippy --no-default-features --features "${{ matrix.features }}" -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV (all features)
        run: cargo check --all-features

  # CXP-0007 P2D.4 — wasm32-unknown-unknown coverage. chime advertises
  # first-class wasm32 support (Cargo.toml splits per-target
  # dependencies for reqwest/gloo-timers); without this job a wasm-only
  # regression — e.g. a tokio API call leaking into the http feature
  # path or a doc-link relying on a native-only re-export — slips
  # through the linux-only matrix above.
  wasm32:
    name: wasm32 (build + doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32, http)
        run: cargo check --target wasm32-unknown-unknown --features http
      - name: cargo build (wasm32, http)
        # `cargo check` exercises typeck but not codegen; a real build
        # surfaces wasm-specific codegen panics (e.g. an inadvertent
        # `unsafe` block that monomorphises to an unsupported intrinsic)
        # before they reach a release tag.
        run: cargo build --target wasm32-unknown-unknown --features http
      - name: cargo doc (wasm32, http, no-deps)
        run: cargo doc --target wasm32-unknown-unknown --no-deps --features http
        env:
          RUSTDOCFLAGS: -Dwarnings

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  package:
    name: Package (cargo publish --dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo package --no-verify
        run: cargo package --no-verify --allow-dirty
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --allow-dirty --all-features

  # CXP-0007 P2D.3 — exercise the live floria integration test with
  # CHIME_INTEGRATION_REQUIRED=1 so a missing floria binary fails the
  # CI run instead of silently green-skipping.
  live-integration:
    name: Live floria integration
    runs-on: ubuntu-latest
    env:
      CHIME_INTEGRATION_REQUIRED: "1"
    steps:
      - name: Checkout chime
        uses: actions/checkout@v4
        with:
          path: chime
      - name: Checkout sibling floria
        uses: actions/checkout@v4
        with:
          repository: contrix-dev/floria
          path: floria
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            chime
            floria
      - name: Build floria binary
        working-directory: floria
        run: cargo build --bin floria
      - name: Run chime live floria integration
        working-directory: chime
        env:
          FLORIA_BIN: ${{ github.workspace }}/floria/target/debug/floria
        run: cargo test --features http,notify --test live_floria_integration -- --test-threads=1

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
