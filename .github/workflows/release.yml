name: Local package verification

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify local package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout sibling Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo package list
        run: cargo package --list --allow-dirty
