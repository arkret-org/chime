name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only — do not actually publish"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify package can be published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate=$(awk -F\" '/^version *=/ {print $2; exit}' Cargo.toml)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --all-features

  github_release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog notes for this tag
        id: notes
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[?"v"\\]?" {flag=1; next}
              /^## / && flag {exit}
              flag {print}
            ' CHANGELOG.md > release-notes.md
          else
            echo "Release v$version" > release-notes.md
          fi

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body_path: release-notes.md
