[package]
name = "chime"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/contrix-dev/chime"
homepage = "https://github.com/contrix-dev/chime"
documentation = "https://docs.rs/chime"
readme = "README.md"
description = "Contrix push notification gateway types and device registration helpers, with support for domestic Chinese Android OEM providers through Bugle."
keywords = ["contrix", "push", "notification", "fcm", "apns"]
categories = ["api-bindings", "network-programming", "web-programming"]
exclude = [
    "_todos.md",
    ".claude/",
    ".github/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
base64 = "0.22"
# R3 CALL-1 (spec b47ff6ec) — the SDK's `MediaTokenResponse.expires_at`
# is `chrono::DateTime<Utc>`. Chime needs the type at its public surface
# (chime exposes the SDK response through `verify_media_token_response`
# / `MediaTokenVerifyContext`) so we pull chrono in directly with the
# default features stripped to keep the wasm32 build slim.
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
# CH-1: pin chime's RFC 9530 content-digest computation to the SDK's
# `http_signature::ContentDigest` so the wire bytes stay byte-identical
# to what floria's verifier and soland's fanout signer emit. The SDK is
# brought in with `default-features = false` + only the `full-surface`
# gate so chime doesn't pick up unrelated runtimes (client/mls/etc.).
contrix = { version = "1.0.0", path = "../contrix-rust-sdk/crates/sdk", default-features = false, features = ["full-surface"] }
httpdate = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
url = "2"

# C34.1: split the `http` transport deps per target. Native targets keep
# reqwest+rustls+tokio; the wasm32 build routes through reqwest's
# fetch-backed wasm32 backend and uses `gloo-timers` for retry sleeps
# because there is no tokio runtime on the browser main thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
# A.5 #2 — wrap bearer tokens in a `SecretString` so Drop zeroes the
# heap allocation. Pulled in only for native targets that build the
# `http` client; the wasm32 build also needs it (token surface is
# identical) and so re-declares the same dep below.
zeroize = { version = "1", features = ["derive"], optional = true }
# A.5 #4 — `NonceTracker` needs a monotonic clock for replay-window
# expiry. The `time` feature on tokio already gives us
# `tokio::time::Instant`, but the nonce tracker also runs in pure
# library tests without a tokio runtime; pull in `instant` so the
# tracker can compile on every target without a runtime dependency.

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }

[features]
default = []
## Enable Contrix HTTP push device registration via reqwest.
##
## On native targets this enables reqwest with rustls-tls + a tokio
## time driver. On wasm32 it enables reqwest's fetch backend and
## gloo-timers (browser `setTimeout`) for the retry backoff.
##
## A.5 #2 — also pulls in `zeroize` so bearer tokens stored on
## `ContrixPushClient` zero their heap allocation on drop. The
## dependency is feature-gated because the bearer-token surface only
## exists when the `http` client is compiled.
http = ["dep:reqwest", "dep:tokio", "dep:gloo-timers", "dep:zeroize"]
## Enable server/gateway-side cx.push.notify wire types.
notify = []

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
