[package]
name = "chime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/contrix-dev/chime"
homepage = "https://github.com/contrix-dev/chime"
documentation = "https://docs.rs/chime"
readme = "README.md"
description = "Contrix push notification gateway types and device registration helpers, with support for domestic Chinese Android OEM providers through Bugle."
keywords = ["contrix", "push", "notification", "fcm", "apns"]
categories = ["api-bindings", "network-programming", "web-programming"]
exclude = [
    "_todos.md",
    ".claude/",
    ".github/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
base64 = "0.22"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
url = "2"

[features]
default = []
## Enable Contrix HTTP push device registration via reqwest.
http = ["dep:reqwest", "dep:tokio"]
## Enable server/gateway-side cx.push.notify wire types.
notify = []

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
