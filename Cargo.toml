[package]
name = "chime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/contrix-dev/chime"
description = "Contrix push notification gateway types and device registration helpers, with support for domestic Chinese Android OEM providers through Bugle."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = []
## Enable Contrix HTTP push device registration via reqwest.
http = ["dep:reqwest"]
