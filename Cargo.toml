[package]
name = "chime"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/arkret-org/chime"
homepage = "https://github.com/arkret-org/chime"
documentation = "https://docs.rs/chime"
readme = "README.md"
description = "Arkret push notification gateway types and device registration helpers, with support for domestic Chinese Android OEM providers through Bugle."
keywords = ["arkret", "push", "notification", "fcm", "apns"]
categories = ["api-bindings", "network-programming", "web-programming"]
exclude = [
    "_todos.md",
    ".claude/",
    ".github/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# R3 CALL-1 (spec b47ff6ec) — the SDK's `CallMediaTokenExchangeOutcome.expires_at`
# is `chrono::DateTime<Utc>`. Chime needs the type at its public surface
# (`MediaTokenVerificationContext` and `verify_media_token_outcome`) so we
# pull chrono in directly with the default features stripped to keep the
# wasm32 build slim.
# CH-1: pin chime's RFC 9530 content-digest computation to the Signatures
# owner's `http_signature::ContentDigest` so the wire bytes stay byte-identical
# to what floria's verifier and soland's fanout signer emit.

# C34.1: split the `http` transport deps per target. Native targets keep
# reqwest+rustls+tokio; the wasm32 build routes through reqwest's
# fetch-backed wasm32 backend and uses `gloo-timers` for retry sleeps
# because there is no tokio runtime on the browser main thread.
base64 = {workspace = true}
chrono = {workspace = true,default-features = false,features = ["serde", "clock"]}
arkret = {workspace = true,default-features = false}
arkret-models-integration = {workspace = true}
arkret-signatures = {workspace = true,default-features = false}
httpdate = {workspace = true}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
url = {workspace = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A.5 #2 — wrap bearer tokens in a `SecretString` so Drop zeroes the
# heap allocation. Pulled in only for native targets that build the
# `http` client; the wasm32 build also needs it (token surface is
# identical) and so re-declares the same dep below.
# A.5 #4 — `NonceTracker` needs a monotonic clock for replay-window
# expiry. The `time` feature on tokio already gives us
# `tokio::time::Instant`, but the nonce tracker also runs in pure
# library tests without a tokio runtime; pull in `instant` so the
# tracker can compile on every target without a runtime dependency.
reqwest = {workspace = true,default-features = false,features = ["json", "rustls"],optional = true}
tokio = {workspace = true,features = ["time"],optional = true}
zeroize = {workspace = true,features = ["derive"],optional = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = {workspace = true,features = ["futures"],optional = true}
reqwest = {workspace = true,default-features = false,features = ["json"],optional = true}
zeroize = {workspace = true,features = ["derive"],optional = true}

[features]
default = []
## Enable Arkret HTTP push device registration via reqwest.
##
## On native targets this enables reqwest with rustls + a tokio
## time driver. On wasm32 it enables reqwest's fetch backend and
## gloo-timers (browser `setTimeout`) for the retry backoff.
##
## A.5 #2 — also pulls in `zeroize` so bearer tokens stored on
## `ArkretPushClient` zero their heap allocation on drop. The
## dependency is feature-gated because the bearer-token surface only
## exists when the `http` client is compiled.
http = ["dep:reqwest", "dep:tokio", "dep:gloo-timers", "dep:zeroize"]
## Enable server/gateway-side ak.edge.push.command.notify wire types.
notify = []

[dev-dependencies]
ed25519-dalek = {workspace = true}
proptest = {workspace = true,default-features = false,features = ["std"]}
tokio = {workspace = true,features = ["io-util", "macros", "net", "rt-multi-thread", "time"]}

[workspace]
resolver = "3"

[workspace.dependencies]
base64 = "0.22"
chrono = {version = "0.4",default-features = false}
arkret = {version = "0.3.0",path = "../arkret-rust-sdk/crates/sdk",default-features = false}
arkret-models-integration = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-integration"}
arkret-signatures = {version = "0.3.0",path = "../arkret-rust-sdk/crates/signatures",default-features = false}
ed25519-dalek = {version = "2.2.0",default-features = false,features = ["std", "rand_core"]}
gloo-timers = "0.4"
httpdate = "1"
proptest = {version = "1",default-features = false}
reqwest = {version = "0.13",default-features = false}
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2"
tokio = "1"
tracing = "0.1"
url = "2"
zeroize = "1"
